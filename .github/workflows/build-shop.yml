name: Build the shop

# Vercel builds and deploys this repo now, so this workflow does NOT publish
# anything. It runs the identical build as a check.
#
# Two reasons that is worth the minute it takes:
#  - Vercel's build logs are not readable from every environment this project is
#    worked on from. These are. When a deploy fails, this says whether the build
#    itself is sound or whether the difference is Vercel's environment.
#  - It gates pull requests before a broken build reaches a deployment.
#
# It runs the same commands vercel.json does, deliberately. If they drift, this
# stops being evidence about the deploy.

on:
  push:
    branches: [main]
    paths:
      - 'standalone/**'
      - 'tools/**'
      - 'api/**'
      - 'package.json'
      - 'vercel.json'
      - '.github/workflows/build-shop.yml'
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-shop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: standalone/package-lock.json

      # Mirrors vercel.json installCommand.
      - name: Install
        run: cd standalone && npm ci --include=dev

      # Mirrors vercel.json buildCommand. Runs the full gate inside standalone -
      # catalogue validation, astro check, the build, the built-HTML checks - then
      # assembles the deployable tree.
      - name: Build
        run: npm run build

      # Nothing else connects the editor's annotations to its save endpoint. A
      # mistyped address would otherwise only surface when someone edited that line
      # and the save came back 400.
      - name: Check every editable annotation resolves
        run: npm run check-edit-ids

      - name: Checkout and content tests
        run: npm test
