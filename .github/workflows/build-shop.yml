name: Build the shop

# Vercel publishes this repo as-is, with no build step. So the shop's HTML has to be
# committed at the repo root, and something has to put it there when the source
# changes - which is this.
#
# It matters most for the copy editor: /edit/ commits JSON to standalone/src/data,
# and only a rebuild turns that JSON into HTML.
#
# The loop is broken by paths: this writes the published entries at the repo root and
# standalone/dist, neither of which is in the trigger list.

on:
  push:
    branches: [main]
    paths:
      - 'standalone/**'
      - 'tools/**'
      - '.github/workflows/build-shop.yml'
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-shop-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: standalone/package-lock.json

      - name: Install
        run: cd standalone && npm ci --include=dev

      # The full gate: catalogue validation, astro check, the build, and the
      # built-HTML content checks.
      - name: Build
        run: cd standalone && npm run build

      # Nothing else connects the editor's annotations to its save endpoint. A
      # mistyped address would otherwise only surface when someone edited that line
      # and the save came back 400.
      - name: Check every editable annotation resolves
        run: node tools/check-edit-ids.mjs standalone/dist

      - name: Checkout and content tests
        run: node tools/test-order.mjs && node tools/test-content.mjs

      - name: Publish to the repo root
        run: node tools/publish.mjs

      # Pull requests get the checks but must not publish - only main does.
      - name: Commit if anything changed
        if: github.event_name != 'pull_request'
        run: |
          git config user.name  "blitzspirit-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A -- . ':!standalone/dist'
          if git diff --cached --quiet; then
            echo "no change to publish"
            exit 0
          fi
          git commit -m "Rebuild the shop" -m "Automated: standalone/ changed, so the published site was rebuilt from it. Source commit ${{ github.sha }}."
          git push
